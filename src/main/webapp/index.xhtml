<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="jakarta.faces.html"
      xmlns:f="jakarta.faces.core"
      xmlns:p="primefaces">

<h:head>
    <title>Calculadora de Nómina - Colombia</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" 
          rel="stylesheet" />
    <link href="https://unpkg.com/primeflex@3.3.1/primeflex.css" rel="stylesheet" />
    <style>
        /* ... tus estilos ... */
    </style>
</h:head>

<h:body>

    <!-- Growl configurado para mostrar también mensajes de validación -->
    <p:growl id="mensajes" showDetail="true" life="3000" globalOnly="false"/>

    <div class="container">
        <h1>Cálculo de Nómina</h1>

        <!-- Formulario independiente para crear/editar -->
        <h:form id="formEdicion">
            <p:fieldset legend="Crear Nuevo Usuario" rendered="#{usuarioBean.modoFormulario eq 'crear'}">
                <h:panelGrid columns="3" cellpadding="5">
                    <p:outputLabel for="nombre" value="Nombre:"/>
                    <p:inputText id="nombre" value="#{usuarioBean.nuevoUsuario.nombre}" required="true"/>
                    <p:message for="nombre"/>

                    <p:outputLabel for="dias" value="Días Trabajados:"/>
                    <p:inputNumber id="dias" value="#{usuarioBean.nuevoUsuario.diasTrabajados}" 
                                   decimalPlaces="0" minValue="1" maxValue="31" required="true"/>
                    <p:message for="dias"/>

                    <p:outputLabel for="salario" value="Salario Base ($):"/>
                    <p:inputNumber id="salario" value="#{usuarioBean.nuevoUsuario.salarioBase}" 
                                   decimalPlaces="2" minValue="0" required="true" locale="es_CO"/>
                    <p:message for="salario"/>
                </h:panelGrid>
                <p:commandButton value="Guardar" action="#{usuarioBean.guardar()}" 
                                 update="mensajes :formTabla:tabla-usuarios" icon="pi pi-save" style="margin-top:10px;"/>
            </p:fieldset>

            <p:fieldset legend="Editar Usuario" rendered="#{usuarioBean.modoFormulario eq 'editar'}">
                <h:panelGrid columns="3" cellpadding="5">
                    <p:outputLabel for="nombreEdit" value="Nombre:"/>
                    <p:inputText id="nombreEdit" value="#{usuarioBean.usuarioSeleccionado.nombre}" required="true"/>
                    <p:message for="nombreEdit"/>

                    <p:outputLabel for="diasEdit" value="Días Trabajados:"/>
                    <p:inputNumber id="diasEdit" value="#{usuarioBean.usuarioSeleccionado.diasTrabajados}" 
                                   decimalPlaces="0" minValue="1" maxValue="31" required="true"/>
                    <p:message for="diasEdit"/>

                    <p:outputLabel for="salarioEdit" value="Salario Base ($):"/>
                    <p:inputNumber id="salarioEdit" value="#{usuarioBean.usuarioSeleccionado.salarioBase}" 
                                   decimalPlaces="2" minValue="0" required="true" locale="es_CO"/>
                    <p:message for="salarioEdit"/>
                </h:panelGrid>
                <p:commandButton value="Actualizar" action="#{usuarioBean.actualizar()}" 
                                 update="mensajes :formTabla:tabla-usuarios" icon="pi pi-check" style="margin-top:10px;"/>
                <p:commandButton value="Cancelar" action="#{usuarioBean.prepararCrear()}" 
                                 update=":formEdicion" icon="pi pi-times" style="margin-left:10px;"/>
            </p:fieldset>
        </h:form>

        <!-- Formulario independiente para la tabla y sus acciones -->
        <h:form id="formTabla">
            <h2>Listado de Empleados</h2>
            <p:dataTable id="tabla-usuarios" value="#{usuarioBean.listaUsuarios}" var="usuario" 
                         paginator="true" rows="10" emptyMessage="No hay usuarios registrados"
                         styleClass="tabla-principal" sortMode="multiple">

                <p:column headerText="ID" sortBy="#{usuario.id}">
                    <h:outputText value="#{usuario.id}"/>
                </p:column>

                <p:column headerText="Nombre" sortBy="#{usuario.nombre}">
                    <h:outputText value="#{usuario.nombre}"/>
                </p:column>

                <p:column headerText="Días Trab." sortBy="#{usuario.diasTrabajados}">
                    <h:outputText value="#{usuario.diasTrabajados}"/>
                </p:column>

                <p:column headerText="Salario Base" sortBy="#{usuario.salarioBase}">
                    <h:outputText value="#{usuario.salarioBase}">
                        <f:convertNumber pattern="#,##0.00" locale="es_CO"/>
                    </h:outputText>
                </p:column>

                <p:column headerText="Valor Salud (4%)">
                    <h:outputText value="#{usuario.valorSalud}">
                        <f:convertNumber pattern="#,##0.00" locale="es_CO"/>
                    </h:outputText>
                </p:column>

                <p:column headerText="Valor Pensión (4%)">
                    <h:outputText value="#{usuario.valorPension}">
                        <f:convertNumber pattern="#,##0.00" locale="es_CO"/>
                    </h:outputText>
                </p:column>

                <p:column headerText="Aux. Transporte">
                    <h:outputText value="#{usuario.auxilioTransporte}">
                        <f:convertNumber pattern="#,##0.00" locale="es_CO"/>
                    </h:outputText>
                </p:column>

                <p:column headerText="Salario Final" styleClass="columna-final">
                    <h:outputText value="#{usuario.salarioFinal}" styleClass="texto-final">
                        <f:convertNumber pattern="#,##0.00" locale="es_CO"/>
                    </h:outputText>
                </p:column>

                <p:column headerText="Acciones" style="text-align:center">
                    <p:commandButton icon="pi pi-pencil" title="Editar" 
                                     action="#{usuarioBean.prepararEditar(usuario)}" 
                                     update=":formEdicion"/>
                    <p:commandButton icon="pi pi-trash" title="Eliminar" 
                                     action="#{usuarioBean.eliminar(usuario.id)}" 
                                     update="mensajes :formTabla:tabla-usuarios" style="margin-left:5px;"/>
                </p:column>
            </p:dataTable>
        </h:form>
    </div>
</h:body>
</html>
